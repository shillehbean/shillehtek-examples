# Minimal mosquitto broker configuration to listen on the default MQTT port (1883) and allow anonymous connections.
#
# Full tutorial: https://shillehtek.com/blogs/news/raspberry-pi-mosquitto-mqtt-send-commands
# Shop parts: https://shillehtek.com
# More examples: https://github.com/shillehbean/shillehtek-examples
#

listener 1883
allow_anonymous true
